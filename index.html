*{box-sizing:border-box}
html,body{margin:0;padding:0}

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============ header ============ */
.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:18px;height:60px}
.brand{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--panel-3);border:1px solid var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.5px}
.brand-t{font-size:15px;font-weight:600;letter-spacing:.2px}
.brand-s{font-size:11px;color:var(--fg-3);border-left:1px solid var(--line-2);padding-left:9px;margin-left:2px;white-space:nowrap}

.search{position:relative;flex:1 1 auto;max-width:540px;margin-left:auto}
.search input{
  width:100%;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
  color:var(--fg);padding:0 84px 0 36px;outline:none;transition:border-color .16s,box-shadow .16s;
}
.search input::placeholder{color:var(--fg-3)}
.search input:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--fg-3);pointer-events:none}
.search .keys{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;gap:4px;align-items:center}

.search button.clear:hover{background:var(--panel-3);color:var(--fg)}
.search.has-val button.clear{display:grid}
.search.has-val .keys{display:none}

/* ============ category bar ============ */
.catbar{border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 80%,transparent)}

<script>
(function(){
  'use strict';
  var DATA = JSON.parse(document.getElementById('tool-data').textContent);
  var CATS = DATA.cats, TOOLS = DATA.tools;
  var CATNAME = {}; CATS.forEach(function(c){ CATNAME[c.k] = c.n; });
  var PRICE = { free:'免费', freemium:'免费额度', paid:'付费' };
  var FAV_KEY = 'ainav.favs.v1';

  var EN = /^[\x20-\x7E]/;
  document.getElementById('updated').textContent = DATA.updated;
  document.getElementById('total').textContent = TOOLS.length;
  document.getElementById('totalCat').textContent = CATS.length;

  /* ---------- 状态 ---------- */
  var favs;
  try { favs = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]')); } catch(e){ favs = new Set(); }
  var state = { q:'', cat:'all', cn:false, free:false, open:false, fav:false, sort:'default' };

  /* ---------- 工具函数 ---------- */
  function domain(u){ try { return new URL(u).hostname.replace(/^www\./,''); } catch(e){ return u; } }
  function initials(name){
    var s = name.trim();
    if (!EN.test(s)) return s.slice(0,2);
    var parts = s.split(/[\s._\-]+/).filter(Boolean);
    return (parts.length > 1 ? parts[0][0] + parts[1][0] : s.slice(0,2)).toUpperCase();
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  /* ---------- 分类栏 ---------- */
  var catbar = document.getElementById('catbar');
  (function buildCats(){
    var counts = {}; TOOLS.forEach(function(t){ counts[t.cat] = (counts[t.cat]||0)+1; });
    var html = '<button class="cat" data-cat="all" aria-pressed="true">全部 <span class="n">'+TOOLS.length+'</span></button>';
    CATS.forEach(function(c){
      if (!counts[c.k]) return;
      html += '<button class="cat" data-cat="'+c.k+'" aria-pressed="false">'+esc(c.n)+' <span class="n">'+counts[c.k]+'</span></button>';
    });
    catbar.innerHTML = html;
    catbar.addEventListener('click', function(e){
      var b = e.target.closest('.cat'); if(!b) return;
      state.cat = b.dataset.cat;
      [].forEach.call(catbar.querySelectorAll('.cat'), function(x){ x.setAttribute('aria-pressed', String(x===b)); });
      render(); window.scrollTo({ top: 0, behavior:'smooth' });
    });
  })();

  /* ---------- 卡片 ---------- */
  function cardHTML(t){
    var f = favs.has(t.name);
    var badges = '<span class="badge '+(t.site ? 'ok':'')+'">'+(t.site ? '国内直连':'需自备网络')+'</span>'
      + '<span class="badge'+(t.price==='free' ? ' free':'')+'">'+PRICE[t.price]+'</span>'
      + (t.open ? '<span class="badge">开源</span>' : '')
      + '<span class="badge">'+esc(CATNAME[t.cat]||'')+'</span>';
    return '<article class="card">'
      + '<a class="card-link" href="'+esc(t.url)+'" target="_blank" rel="noopener nofollow" aria-label="打开 '+esc(t.name)+' 官网"></a>'
      + '<div class="card-head">'
      +   '<span class="logo" aria-hidden="true">'+esc(initials(t.name))+'</span>'
      +   '<div class="card-title"><h3>'+esc(t.name)+(t.hot?'<span class="star" title="常用推荐">★</span>':'')+'</h3>'
      +     '<span class="domain">'+esc(domain(t.url))+'</span></div>'
      +   '<button class="fav" data-name="'+esc(t.name)+'" aria-pressed="'+f+'" title="'+(f?'取消收藏':'加入收藏')+'" aria-label="收藏 '+esc(t.name)+'">'+(f?'★':'☆')+'</button>'
      + '</div>'
      + '<p class="card-desc">'+esc(t.desc)+'</p>'
      + '<div class="badges">'+badges+'</div>'
      + '</article>';
  }

  /* ---------- 精选 ---------- */
  var FEATURED = ['DeepSeek','豆包','通义灵码','秘塔 AI 搜索','即梦','剪映','ima','沉浸式翻译'];
  (function buildFeatured(){
    var pick = [], byName = {}; TOOLS.forEach(function(t){ byName[t.name] = t; });
    FEATURED.forEach(function(n){ if (byName[n]) pick.push(byName[n]); });
    if (pick.length < 8){
      TOOLS.filter(function(t){ return t.hot; }).forEach(function(t){
        if (pick.length < 8 && pick.indexOf(t) < 0) pick.push(t);
      });
    }
    pick = pick.slice(0,8);
    document.getElementById('fgrid').innerHTML = pick.map(cardHTML).join('');
  })();

  /* ---------- 筛选 + 渲染 ---------- */
  var results = document.getElementById('results');
  var empty = document.getElementById('empty');
  var countEl = document.getElementById('count');
  var featured = document.getElementById('featured');

  function match(t){
    if (state.cat !== 'all' && t.cat !== state.cat) return false;
    if (state.cn && !t.site) return false;
    if (state.free && t.price === 'paid') return false;
    if (state.open && !t.open) return false;
    if (state.fav && !favs.has(t.name)) return false;
    if (state.q){
      var hay = (t.name + ' ' + t.desc + ' ' + t.cat + ' ' + CATNAME[t.cat] + ' ' + domain(t.url) + ' ' + t.url).toLowerCase();
      var words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
      for (var i=0;i<words.length;i++){ if (hay.indexOf(words[i]) < 0) return false; }
    }
    return true;
  }

  function sorted(list){
    if (state.sort === 'name') return list.slice().sort(function(a,b){ return a.name.localeCompare(b.name,'zh'); });
    return list.slice().sort(function(a,b){ return (b.hot?1:0) - (a.hot?1:0); });
  }

  function render(){
    var isFiltering = state.q || state.cat !== 'all' || state.cn || state.free || state.open || state.fav;
    featured.style.display = isFiltering ? 'none' : '';

    var list = TOOLS.filter(match);
    countEl.innerHTML = '显示 <b>'+list.length+'</b> 个工具' + (isFiltering ? '' : '（全部 ' + TOOLS.length + ' 个）');
    empty.classList.toggle('on', list.length === 0);

    if (state.cat !== 'all' || isFiltering){
      results.innerHTML = '<div class="grid">' + sorted(list).map(cardHTML).join('') + '</div>';
    } else {
      // 全部分类视图：按类别分组，便于扫读
      var html = '', groups = {};
      sorted(list).forEach(function(t){ (groups[t.cat] = groups[t.cat] || []).push(t); });
      CATS.forEach(function(c){
        var g = groups[c.k]; if(!g || !g.length) return;
        html += '<section class="catblock"><header><h2>'+esc(c.n)+'</h2><span class="n">'+g.length+'</span></header>'
              + '<div class="grid">' + g.map(cardHTML).join('') + '</div></section>';
      });
      results.innerHTML = html;
    }
  }

  /* ---------- 收藏 ---------- */
  document.body.addEventListener('click', function(e){
    var b = e.target.closest('.fav'); if(!b) return;
    e.preventDefault(); e.stopPropagation();
    var n = b.dataset.name;
    if (favs.has(n)) { favs.delete(n); toast('已取消收藏 · ' + n); }
    else { favs.add(n); toast('已收藏 · ' + n); }
    try { localStorage.setItem(FAV_KEY, JSON.stringify([].slice.call(favs))); } catch(err){}
    document.querySelectorAll('.fav[data-name="'+n+'"]').forEach(function(x){
      var on = favs.has(n);
      x.setAttribute('aria-pressed', String(on));
      x.textContent = on ? '★' : '☆';
    });
    if (state.fav) render();
  });

  /* ---------- 搜索 ---------- */
  var input = document.getElementById('q'), wrap = document.getElementById('searchWrap'), clearBtn = document.getElementById('clearQ');
  var timer;
  input.addEventListener('input', function(){
    wrap.classList.toggle('has-val', !!input.value);
    clearTimeout(timer);
    timer = setTimeout(function(){ state.q = input.value.trim(); render(); }, 90);
  });
  clearBtn.addEventListener('click', function(){ input.value=''; wrap.classList.remove('has-val'); state.q=''; render(); input.focus(); });

  /* ---------- 筛选按钮 ---------- */
  [].forEach.call(document.querySelectorAll('.tgl'), function(b){
    b.addEventListener('click', function(){
      var k = b.dataset.f, on = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', String(on));
      if (k === 'free') state.free = on; else state[k] = on;
      render();
    });
  });
  document.getElementById('sort').addEventListener('change', function(){ state.sort = this.value; render(); });

  /* ---------- 快捷键 ---------- */
  document.addEventListener('keydown', function(e){
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); input.focus(); input.select(); return; }
    if (e.key === '/' && document.activeElement !== input){ e.preventDefault(); input.focus(); return; }
    if (e.key === 'Escape' && document.activeElement === input){ input.value=''; wrap.classList.remove('has-val'); state.q=''; render(); input.blur(); }
  });

  /* ---------- toast ---------- */
  var toastEl = document.getElementById('toast'), tid;
  function toast(msg){
    toastEl.textContent = msg; toastEl.classList.add('on');
    clearTimeout(tid); tid = setTimeout(function(){ toastEl.classList.remove('on'); }, 1500);
  }

  render();
})();
</script>
</body>
</html>
